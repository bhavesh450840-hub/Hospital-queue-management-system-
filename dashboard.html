<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Dashboard</title><link rel="stylesheet" href="/css/styles.css"></head><body><header class="topbar"><a class="brand" href="/">✚ CareQueue</a><nav><a href="/">Register</a><a href="/display.html">Live Display</a><button id="logoutBtn" class="nav-button">Logout</button></nav></header><main class="container"><div class="panel-heading"><div><p class="eyebrow">STAFF WORKSPACE</p><h1>Queue dashboard</h1><p id="welcome" class="muted"></p></div><span class="live-dot">LIVE</span></div><section class="panel"><div class="form-row"><label>Department<select id="staffDepartment"><option>General</option><option>Emergency</option><option>Pediatrics</option><option>Cardiology</option></select></label><div class="action-end"><button id="callNextBtn" class="btn primary">Call next patient</button></div></div><div class="queue-stats"><div><strong id="staffWaiting">0</strong><span>Waiting</span></div><div><strong id="staffServing">0</strong><span>Serving</span></div><div><strong id="staffCompleted">0</strong><span>Completed</span></div></div><h2>Department queue</h2><div id="staffQueue" class="queue-list"></div></section><section class="panel"><h2>Patient records</h2><label>Search by name or phone<input id="patientSearch" placeholder="Search records"></label><div id="patientResults" class="queue-list"></div></section></main><script src="/socket.io/socket.io.js"></script><script src="/js/dashboard.js"></script></body></html>
